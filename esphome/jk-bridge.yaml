# Плата ESP32-C3 SuperMini рядом с JK BMS (JK-B2A8S20P, hw V11A).
# Читает BMS по Bluetooth и раз в минуту отправляет данные боту на Cloudflare.
# По току батареи быстро (~30 сек) определяет пропажу/появление света (инвертор в режиме Utility first).
# Wi-Fi настраивается после прошивки (web.esphome.io -> Connect to Wi-Fi) или через точку "JK-Bridge-Setup".
# Секрет bms_key подставляется при сборке на GitHub из Secrets (BMS_KEY).
# Синий светодиод:
#   горит постоянно      — всё хорошо: BMS на связи, бот принимает данные
#   медленно мигает (1 с) — Wi-Fi есть, но BMS по Bluetooth не видна
#   двойная вспышка       — BMS видна, но бот не принимает данные (ключ/интернет)
#   часто мигает          — нет Wi-Fi

esphome:
  name: jk-bridge
  friendly_name: JK Bridge

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: github://syssi/esphome-jk-bms@main
    components: [jk_bms_ble]
    refresh: 1d

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    esp32_ble_tracker: WARN
    esp32_ble_client: WARN

wifi:
  ap:
    ssid: "JK-Bridge-Setup"
    password: "jkbridge123"
  reboot_timeout: 15min

captive_portal:

improv_serial:

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: "C8:47:80:1A:BE:1C"   # BMS «Nick»
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 10s
    id: bms0

globals:
  - id: pause_until
    type: uint32_t
    initial_value: "0"
  # свет по току батареи: -1 неизвестно, 0 нет, 1 есть
  - id: grid_state
    type: int
    initial_value: "-1"
  - id: grid_cand
    type: int
    initial_value: "-1"
  - id: grid_cnt
    type: int
    initial_value: "0"
  - id: force_post
    type: bool
    initial_value: "false"
  - id: bot_ok
    type: bool
    initial_value: "true"
  # энергия с момента включения платы, Вт·ч (бот считает по ним статистику)
  - id: e_in
    type: float
    initial_value: "0"
  - id: e_out
    type: float
    initial_value: "0"
  - id: e_last
    type: uint32_t
    initial_value: "0"

output:
  - platform: gpio
    id: led
    pin:
      number: GPIO8
      inverted: true
      ignore_strapping_warning: true

http_request:
  verify_ssl: true
  timeout: 15s

sensor:
  - platform: wifi_signal
    id: rssi
    update_interval: 60s
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    state_of_charge:
      id: soc
    capacity_remaining:
      id: remain_ah
    full_charge_capacity:
      id: capacity_ah
    total_voltage:
      id: voltage
    current:
      id: current
    power:
      id: power
    min_cell_voltage:
      id: cell_min
    max_cell_voltage:
      id: cell_max
    temperature_sensor_1:
      id: t1
    temperature_sensor_2:
      id: t2
    mosfet_temperature:
      id: mos_t
    charging_cycles:
      id: cycles
    cell_voltage_1:
      id: c1
    cell_voltage_2:
      id: c2
    cell_voltage_3:
      id: c3
    cell_voltage_4:
      id: c4
    cell_voltage_5:
      id: c5
    cell_voltage_6:
      id: c6
    cell_voltage_7:
      id: c7
    cell_voltage_8:
      id: c8

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balancing:
      id: balancing
    online_status:
      id: bms_online
    charging:
      id: chg_on
    discharging:
      id: dis_on

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    errors_bitmask_hex:
      id: err_hex

switch:
  - platform: ble_client
    ble_client_id: client0
    id: ble_switch
    name: "BMS Bluetooth"
    restore_mode: ALWAYS_ON

script:
  - id: send_data
    mode: queued
    max_runs: 2
    then:
      - http_request.post:
          url: https://power-watch.nikolaysha.workers.dev/bms
          request_headers:
            X-Key: !secret bms_key
            Content-Type: application/json
          json: |-
            bool ok = id(bms_online).has_state() && id(bms_online).state && id(soc).has_state() && !std::isnan(id(soc).state);
            root["online"] = ok;
            if (ok && id(grid_state) >= 0) root["grid"] = id(grid_state) == 1;
            if (!std::isnan(id(rssi).state)) root["rssi"] = id(rssi).state;
            if (ok) {
              auto put = [&](const char *k, sensor::Sensor *s) {
                if (s->has_state() && !std::isnan(s->state)) root[k] = s->state;
              };
              put("soc", id(soc));
              put("remain_ah", id(remain_ah));
              put("capacity_ah", id(capacity_ah));
              put("voltage", id(voltage));
              put("current", id(current));
              put("power", id(power));
              put("cell_min", id(cell_min));
              put("cell_max", id(cell_max));
              put("t1", id(t1));
              put("t2", id(t2));
              put("mos_t", id(mos_t));
              put("cycles", id(cycles));
              root["balancing"] = id(balancing).has_state() && id(balancing).state;
              if (id(chg_on).has_state()) root["chg"] = id(chg_on).state;
              if (id(dis_on).has_state()) root["dis"] = id(dis_on).state;
              if (id(err_hex).has_state()) root["err"] = (uint32_t) strtoul(id(err_hex).state.c_str(), nullptr, 16);
              JsonArray cells = root["cells"].to<JsonArray>();
              for (auto *c : {id(c1), id(c2), id(c3), id(c4), id(c5), id(c6), id(c7), id(c8)})
                cells.add(c->has_state() && !std::isnan(c->state) ? roundf(c->state * 1000) / 1000 : 0);
            }
            root["e_in"] = roundf(id(e_in) * 10) / 10;
            root["e_out"] = roundf(id(e_out) * 10) / 10;
          capture_response: true
          max_response_buffer_size: 256
          on_response:
            then:
              - lambda: |-
                  id(bot_ok) = response->status_code == 200;
                  if (response->status_code != 200) {
                    ESP_LOGW("bridge", "Бот ответил %d", response->status_code);
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    int pause = root["pause"] | 0;
                    if (pause > 0) {
                      id(pause_until) = millis() + (uint32_t) pause * 60000UL;
                      if (id(ble_switch).state) {
                        ESP_LOGI("bridge", "Отпускаем Bluetooth для приложения на %d мин", pause);
                        id(ble_switch).turn_off();
                      }
                    }
                    return true;
                  });
          on_error:
            then:
              - lambda: 'id(bot_ok) = false;'

interval:
  # Раз в минуту: отправляем данные боту
  - interval: 60s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: send_data
  # Свет по току батареи: разряд > 0.8 А 30 сек = света нет; ток > -0.3 А 30 сек = свет есть
  - interval: 10s
    then:
      - lambda: |-
          uint32_t now = millis();
          float dt = id(e_last) ? (now - id(e_last)) / 3600000.0f : 0; id(e_last) = now;
          if (!id(bms_online).has_state() || !id(bms_online).state || std::isnan(id(current).state)) return;
          float a = id(current).state;
          if (!std::isnan(id(power).state) && dt > 0 && dt < 0.01f) {   // копим Вт·ч заряда/разряда
            float pw = id(power).state;
            if (pw > 0) id(e_in) += pw * dt; else id(e_out) += -pw * dt;
          }
          int obs = a < -0.8f ? 0 : (a > -0.3f ? 1 : id(grid_state));
          if (obs < 0 || obs == id(grid_state)) { id(grid_cnt) = 0; return; }
          if (obs != id(grid_cand)) { id(grid_cand) = obs; id(grid_cnt) = 1; } else { id(grid_cnt)++; }
          if (id(grid_cnt) >= 3) {
            id(grid_state) = obs; id(grid_cnt) = 0; id(force_post) = true;
            ESP_LOGI("bridge", "Свет по батарее: %s (ток %.1f А)", obs ? "есть" : "нет", a);
          }
  # Срочная отправка при смене света
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(force_post);'
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - lambda: 'id(force_post) = false;'
                  - script.execute: send_data
  # Возвращаем Bluetooth после паузы
  - interval: 20s
    then:
      - lambda: |-
          if (!id(ble_switch).state && (int32_t)(millis() - id(pause_until)) >= 0) {
            ESP_LOGI("bridge", "Пауза закончилась, подключаемся к BMS");
            id(ble_switch).turn_on();
          }
  # Синий светодиод — состояние платы
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t t = 0; t++;
          bool on;
          bool bms = id(bms_online).has_state() && id(bms_online).state;
          if (!wifi::global_wifi_component->is_connected()) on = (t / 2) % 2 == 0;      // часто: нет Wi-Fi
          else if (!bms) on = (t / 10) % 2 == 0;                                         // медленно: нет BMS
          else if (!id(bot_ok)) { uint32_t p = t % 20; on = p < 2 || (p >= 4 && p < 6); } // двойная: бот не принимает
          else on = true;                                                                 // всё хорошо
          if (on) id(led).turn_on(); else id(led).turn_off();
