name: power-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # запуск каждые 5 минут, каждый работает ~9 минут (с перекрытием)
  workflow_dispatch:         # кнопка ручного запуска

permissions:
  contents: write            # чтобы сохранять state.json в репозиторий

concurrency:
  group: power-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Проверка сети
        env:
          SMARTESS_USER: ${{ secrets.SMARTESS_USER }}
          SMARTESS_PASS: ${{ secrets.SMARTESS_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: "${{ secrets.TG_CHAT_ID }},${{ secrets.TG_CHAT_ID_EXTRA }}"
          API_PROFILE: ${{ vars.API_PROFILE || 'dessmonitor' }}
          STATE_FILE: state.json
          POLL_SECONDS: "30"
          COMMIT_STATE: "1"
        run: python power_watch.py --for 540

      - name: Сохранить состояние
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "power-watch"
            git config user.email "power-watch@users.noreply.github.com"
            git add state.json
            git commit -m "state update"
            git pull --rebase -X theirs origin main || true
            git push
          fi
